services:
  # PostgreSQL 16 with Extensions
  postgres:
    image: postgres:16-alpine
    container_name: irib-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma:/docker-entrypoint-initdb.d
    command: >
      postgres
        -c shared_preload_libraries='pg_stat_statements'
        -c pg_stat_statements.track=all
        -c pg_stat_statements.max=10000
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c max_connections=100
        -c log_min_duration_statement=1000
        -c log_statement='ddl'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U irib_admin -d irib_dwp']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - irib_network

  # Redis (Cache + Session + Pub/Sub)
  redis:
    image: redis:7-alpine
    container_name: irib-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: >
      redis-server
        --appendonly yes
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 256mb
        --maxmemory-policy noeviction
        --save 60 1000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - irib_network

  # MinIO (S3 Compatible Object Storage)
  minio:
    image: minio/minio:latest
    container_name: irib-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - irib_network

  # OpenSearch (Search & Analytics)
  opensearch-node1:
    image: opensearchproject/opensearch:2.11.0
    container_name: irib-opensearch-node1
    restart: unless-stopped
    ports:
      - '9200:9200'
    environment:
      - cluster.name=irib-dwp-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_node1_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - irib_network

  opensearch-node2:
    image: opensearchproject/opensearch:2.11.0
    container_name: irib-opensearch-node2
    restart: unless-stopped
    environment:
      - cluster.name=irib-dwp-cluster
      - node.name=opensearch-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node3
      - cluster.initial_master_nodes=opensearch-node1,opensearch-node2,opensearch-node3
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_node2_data:/usr/share/opensearch/data
    networks:
      - irib_network

  opensearch-node3:
    image: opensearchproject/opensearch:2.11.0
    container_name: irib-opensearch-node3
    restart: unless-stopped
    environment:
      - cluster.name=irib-dwp-cluster
      - node.name=opensearch-node3
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_master_nodes=opensearch-node1,opensearch-node2,opensearch-node3
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_node3_data:/usr/share/opensearch/data
    networks:
      - irib_network

  # Keycloak (IAM)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: irib-keycloak
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - irib_network

  # Mailhog (Email Testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: irib-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - irib_network

  # Zookeeper (for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: irib-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - irib_network

  # Kafka (Event Streaming)
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: irib-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    networks:
      - irib_network

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        NODE_ENV: development
        ENVIRONMENT: development
    container_name: irib-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      ENVIRONMENT: development
      CI: "true"
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      PNPM_STATUS_CHECK: "false"
    command: npx next dev
    depends_on:
      - backend
    networks:
      - irib_network

  # Backend (NestJS)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
      args:
        NODE_ENV: development
        ENVIRONMENT: development
        DATABASE_URL: ${DATABASE_URL}
    container_name: irib-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/workspace/backend
      - /workspace/node_modules
    environment:
      NODE_ENV: development
      ENVIRONMENT: development
      CI: "true"
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://irib-frontend:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      KAFKA_BROKERS: kafka:9092
      KAFKA_ENABLED: false
      AUTH_TYPE: local
      ENABLE_DEV_WIZARD: "true"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: irib
      KEYCLOAK_CLIENT_ID: irib-backend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: false
      OPENSEARCH_HOST: opensearch-node1
      OPENSEARCH_PORT: 9200
      OPENSEARCH_ENDPOINT: http://opensearch-node1:9200
    command: pnpm run dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch-node1:
        condition: service_healthy
    networks:
      - irib_network

networks:
  irib_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  opensearch_node1_data:
  opensearch_node2_data:
  opensearch_node3_data:
