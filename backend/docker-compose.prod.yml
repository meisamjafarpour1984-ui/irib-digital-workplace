# Production Docker Compose Configuration
# Security Hardened with Secrets, Networks, and Health Checks
version: '3.8'

services:
  # PostgreSQL 16 with Security Hardening
  postgres:
    image: postgres:16-alpine
    container_name: irib-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: irib_dwp
      POSTGRES_USER: irib_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    secrets:
      - postgres_password
      - redis_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
      - ./backups/postgres:/backups
    command: >
      postgres
        -c shared_preload_libraries='pg_stat_statements'
        -c pg_stat_statements.track=all
        -c pg_stat_statements.max=10000
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c max_connections=100
        -c log_min_duration_statement=1000
        -c log_statement='ddl'
    networks:
      - backend_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U irib_admin -d irib_dwp']
      interval: 10s
      timeout: 5s
      retries: 5

  # PgBouncer (Connection Pooler)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: irib-pgbouncer
    restart: unless-stopped
    ports:
      - '6432:6432'
    environment:
      DATABASE_URL: postgres://irib_admin:${POSTGRES_PASSWORD}@postgres:5432/irib_dwp
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 100
      SERVER_IDLE_TIMEOUT: 600
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_network

  # Redis (Cache + Session + Pub/Sub)
  redis:
    image: redis:7-alpine
    container_name: irib-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: >
      redis-server
        --appendonly yes
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 256mb
        --maxmemory-policy noeviction
        --save 60 1000
    volumes:
      - redis_data:/data
      - ./backups/redis:/backups
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - redis_password

  # MinIO (S3 Compatible Object Storage)
  minio:
    image: minio/minio:latest
    container_name: irib-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: irib_minio_admin
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
      MINIO_BROWSER: 'off'
    secrets:
      - minio_password
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data
      - ./backups/minio:/backups
    networks:
      - backend_network

  # OpenSearch (Search & Analytics)
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: irib-opensearch
    restart: unless-stopped
    ports:
      - '9200:9200'
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - index.max_result_window=10000
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - backend_network

  # Keycloak (IAM)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: irib-keycloak
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/irib_dwp
      KC_DB_USERNAME: irib_admin
      KC_DB_PASSWORD_FILE: /run/secrets/postgres_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_password
    secrets:
      - postgres_password
      - keycloak_password
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_network

  # Mailhog (Email Testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: irib-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - backend_network

  # Zookeeper (for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: irib-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - backend_network

  # Kafka (Event Streaming)
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: irib-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    networks:
      - backend_network

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  minio_password:
    file: ./secrets/minio_password.txt
  keycloak_password:
    file: ./secrets/keycloak_password.txt

networks:
  backend_network:
    driver: bridge
    internal: true  # Isolated network for backend services

volumes:
  postgres_data:
  redis_data:
  minio_data:
  opensearch_data: