apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: dwp
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "auth/kubernetes"
          role: "dwp-backend"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: dwp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: dwp/backend/database-url
    - secretKey: jwt-secret
      remoteRef:
        key: dwp/backend/jwt-secret
    - secretKey: redis-password
      remoteRef:
        key: dwp/backend/redis-password
    - secretKey: minio-access-key
      remoteRef:
        key: dwp/backend/minio-access-key
    - secretKey: minio-secret-key
      remoteRef:
        key: dwp/backend/minio-secret-key
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-frontend
  namespace: dwp
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "auth/kubernetes"
          role: "dwp-frontend"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: frontend-secrets
  namespace: dwp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-frontend
    kind: SecretStore
  target:
    name: frontend-secrets
    creationPolicy: Owner
  data:
    - secretKey: api-url
      remoteRef:
        key: dwp/frontend/api-url
    - secretKey: next-auth-secret
      remoteRef:
        key: dwp/frontend/next-auth-secret
