---
# ============================================================
# IRIB DWP — Ansible Bootstrap Playbook
# Phase 0: OS Hardening, K3s Install, Core Components
# ============================================================

- name: IRIB DWP Platform Bootstrap
  hosts: all
  become: yes
  vars:
    k3s_version: "v1.29.1+k3s1"
    cilium_version: "1.15.1"
    vault_version: "1.15.4"
    cert_manager_version: "v1.14.4"

  tasks:
    # ============================================
    # 1. OS Hardening
    # ============================================
    - name: Update all packages
      apt:
        upgrade: dist
        update_cache: yes

    - name: Install essential packages
      apt:
        name:
          - curl
          - wget
          - jq
          - yq
          - htop
          - iotop
          - net-tools
          - dnsutils
          - tls1.2
          - ca-certificates
          - gnupg
          - lsb-release
          - apt-transport-https
          - software-properties-common
          - python3-pip
          - python3-kubernetes
        state: present

    - name: Set hostname
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Configure kernel parameters
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_set: yes
        state: present
        reload: yes
      loop:
        - { key: "net.ipv4.ip_forward", value: "1" }
        - { key: "net.bridge.bridge-nf-call-iptables", value: "1" }
        - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
        - { key: "fs.inotify.max_user_watches", value: "524288" }
        - { key: "fs.inotify.max_user_instances", value: "512" }
        - { key: "vm.max_map_count", value: "262144" }
        - { key: "net.core.somaxconn", value: "65535" }

    - name: Disable swap
      command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Remove swap from fstab
      lineinfile:
        path: /etc/fstab
        regexp: '\sswap\s'
        state: absent

    - name: Load required kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter
        - ip_vs
        - ip_vs_rr
        - ip_vs_wrr
        - ip_vs_sh
        - nf_conntrack

    - name: Persist kernel modules
      lineinfile:
        path: /etc/modules-load.d/k8s.conf
        line: "{{ item }}"
        create: yes
      loop:
        - overlay
        - br_netfilter

    # ============================================
    # 2. Container Runtime (containerd)
    # ============================================
    - name: Install containerd
      apt:
        name: containerd
        state: present

    - name: Configure containerd
      template:
        src: templates/config.toml.j2
        dest: /etc/containerd/config.toml
      notify: restart containerd

    # ============================================
    # 3. K3s Installation
    # ============================================
    - name: Download K3s install script
      get_url:
        url: https://get.k3s.io
        dest: /usr/local/bin/k3s-install.sh
        mode: '0755'

    - name: Install K3s (Server)
      shell: |
        INSTALL_K3S_VERSION={{ k3s_version }} \
        INSTALL_K3S_EXEC="server \
          --disable=traefik \
          --disable=servicelb \
          --flannel-backend=none \
          --disable-network-policy \
          --cluster-cidr=10.244.0.0/16 \
          --service-cidr=10.43.0.0/16 \
          --tls-san={{ ansible_default_ipv4.address }} \
          --tls-san=k8s.iribtabriz.ir" \
        sh -s -
      args:
        creates: /usr/local/bin/k3s
      when: "'k3s_servers' in group_names"

    - name: Install K3s (Agent)
      shell: |
        INSTALL_K3S_VERSION={{ k3s_version }} \
        INSTALL_K3S_EXEC="agent" \
        K3S_URL=https://{{ hostvars[groups['k3s_servers'][0]]['ansible_default_ipv4.address'] }}:6443 \
        K3S_TOKEN={{ hostvars[groups['k3s_servers'][0]]['token'] | default(lookup('file', '/var/lib/rancher/k3s/server/node-token')) }} \
        sh -s -
      args:
        creates: /usr/local/bin/k3s-agent-uninstall.sh
      when: "'k3s_agents' in group_names"

    # ============================================
    # 4. kubectl Configuration
    # ============================================
    - name: Symlink kubectl
      file:
        src: /usr/local/bin/k3s
        dest: /usr/local/bin/kubectl
        state: link
        force: yes

    - name: Set KUBECONFIG
      lineinfile:
        path: /etc/environment
        regexp: '^KUBECONFIG='
        line: 'KUBECONFIG=/etc/rancher/k3s/k3s.yaml'
        create: yes

    # ============================================
    # 5. Cilium CNI Installation
    # ============================================
    - name: Add Cilium Helm repo
      kubernetes.core.helm_repository:
        name: cilium
        repo_url: "https://helm.cilium.io/"

    - name: Install Cilium
      kubernetes.core.helm:
        name: cilium
        namespace: kube-system
        chart_ref: cilium/cilium
        chart_version: "{{ cilium_version }}"
        values:
          kubeProxyReplacement: strict
          hubble:
            enabled: true
            relay:
              enabled: true
            ui:
              enabled: true
          operator:
            replicas: 1
          prometheus:
            enabled: true
          memory:
            limited: true
      run_once: yes
      delegate_to: "{{ groups['k3s_servers'][0] }}"

    # ============================================
    # 6. Cert-Manager Installation
    # ============================================
    - name: Add Jetstack Helm repo
      kubernetes.core.helm_repository:
        name: jetstack
        repo_url: "https://charts.jetstack.io"

    - name: Install cert-manager
      kubernetes.core.helm:
        name: cert-manager
        namespace: cert-manager
        chart_ref: jetstack/cert-manager
        chart_version: "{{ cert_manager_version }}"
        create_namespace: yes
        values:
          installCRDs: true
          prometheus:
            enabled: true
      run_once: yes
      delegate_to: "{{ groups['k3s_servers'][0] }}"

    # ============================================
    # 7. HashiCorp Vault Installation
    # ============================================
    - name: Add HashiCorp Helm repo
      kubernetes.core.helm_repository:
        name: hashicorp
        repo_url: "https://helm.releases.hashicorp.com"

    - name: Install Vault
      kubernetes.core.helm:
        name: vault
        namespace: vault
        chart_ref: hashicorp/vault
        create_namespace: yes
        values:
          server:
            ha:
              enabled: true
              replicas: 3
            auditStorage:
              enabled: true
            dataStorage:
              enabled: true
              size: 10Gi
            dev: false
      run_once: yes
      delegate_to: "{{ groups['k3s_servers'][0] }}"

  # ============================================
  # Handlers
  # ============================================
  handlers:
    - name: restart containerd
      service:
        name: containerd
        state: restarted
