apiVersion: v1
kind: ConfigMap
metadata:
  name: wal-g-config
  namespace: dwp
data:
  WALG_S3_PREFIX: "s3://dwp-backups/postgres"
  AWS_ACCESS_KEY_ID: "$(MINIO_ACCESS_KEY)"
  AWS_SECRET_ACCESS_KEY: "$(MINIO_SECRET_KEY)"
  AWS_ENDPOINT: "http://minio:9000"
  AWS_REGION: "us-east-1"
  WALG_COMPRESSION_METHOD: "lz4"
  WALG_DOWNLOAD_CONCURRENCY: "4"
  WALG_UPLOAD_CONCURRENCY: "4"
  PGUSER: "$(POSTGRES_USER)"
  PGDATABASE: "$(POSTGRES_DB)"
  PGHOST: "postgres"
  PGPORT: "5432"
---
apiVersion: v1
kind: Secret
metadata:
  name: wal-g-credentials
  namespace: dwp
type: Opaque
stringData:
  # Secrets will be injected from environment variables or external secrets
  MINIO_ACCESS_KEY: ""
  MINIO_SECRET_KEY: ""
  WALG_S3_PREFIX: "s3://dwp-backups/postgres"
  AWS_ENDPOINT: "http://minio:9000"
  AWS_REGION: "us-east-1"
  PGHOST: "postgres"
  PGPORT: "5432"
  PGUSER: ""
  PGDATABASE: ""
  PGPASSWORD: ""
