[databases]
irib_dwp = host=postgres port=5432 dbname=irib_dwp pool_size=25

[pgbouncer]
# Connection settings
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /var/run/postgresql

# Pooling mode
pool_mode = transaction

# Connection limits
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 100
max_user_connections = 100

# Timeouts
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
query_timeout = 300
client_idle_timeout = 60

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60

# Admin settings
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

# Security
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Performance
ignore_startup_parameters = extra_float_digits
server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = select 1

# TLS (optional, enable for production)
# tls_ca_file = /etc/pgbouncer/ca.crt
# tls_cert_file = /etc/pgbouncer/server.crt
# tls_key_file = /etc/pgbouncer/server.key
