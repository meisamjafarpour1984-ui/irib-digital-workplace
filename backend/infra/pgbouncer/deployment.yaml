apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: dwp
  labels:
    app: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: pgbouncer/pgbouncer:latest
          ports:
            - containerPort: 6432
              name: pgbouncer
          env:
            - name: PGBOUNCER_INI
              value: "/etc/pgbouncer/pgbouncer.ini"
            - name: DATABASE_URL_HOST
              value: postgres
            - name: DATABASE_URL_PORT
              value: "5432"
            - name: DATABASE_URL_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: DATABASE_URL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: DATABASE_URL_DBNAME
              value: irib_dwp
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer
              readOnly: true
            - name: userlist
              mountPath: /etc/pgbouncer/userlist.txt
              subPath: userlist.txt
              readOnly: true
          livenessProbe:
            exec:
              command:
                - pgbouncer
                - --show-config
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pgbouncer
                - --show-config
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config
        - name: userlist
          secret:
            secretName: pgbouncer-userlist
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: dwp
  labels:
    app: pgbouncer
spec:
  type: ClusterIP
  ports:
    - port: 6432
      targetPort: 6432
      name: pgbouncer
  selector:
    app: pgbouncer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: dwp
data:
  pgbouncer.ini: |
    [databases]
    irib_dwp = host=postgres port=5432 dbname=irib_dwp pool_size=25

    [pgbouncer]
    # Connection settings
    listen_addr = 0.0.0.0
    listen_port = 6432

    # Pooling mode
    pool_mode = transaction

    # Connection limits
    max_client_conn = 1000
    default_pool_size = 25
    min_pool_size = 5
    reserve_pool_size = 5
    reserve_pool_timeout = 3

    # Timeouts
    server_lifetime = 3600
    server_idle_timeout = 600
    server_connect_timeout = 15
    query_timeout = 300
    client_idle_timeout = 60

    # Logging
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1
    log_stats = 1
    stats_period = 60

    # Admin settings
    admin_users = pgbouncer_admin
    stats_users = pgbouncer_stats

    # Security
    auth_type = md5

    # Performance
    ignore_startup_parameters = extra_float_digits
    server_reset_query = DISCARD ALL
    server_check_delay = 30
    server_check_query = select 1
