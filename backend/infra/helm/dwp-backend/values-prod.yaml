# ============================================================
# IRIB DWP Backend — Helm Values (Production)
# ============================================================

replicaCount: 3

image:
  repository: ghcr.io/irib-digital-workplace/irib-digital-workplace-backend
  pullPolicy: IfNotPresent
  tag: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
  hosts:
    - host: api.iribtabriz.ir
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: dwp-backend-tls
      hosts:
        - api.iribtabriz.ir

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 4000m
    memory: 8Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - dwp-backend
          topologyKey: kubernetes.io/hostname
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - dwp-backend
        topologyKey: "topology.kubernetes.io/zone"

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3001"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: dwp-database-credentials
        key: url
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: dwp-redis-credentials
        key: url
  - name: KEYCLOAK_URL
    valueFrom:
      secretKeyRef:
        name: dwp-keycloak-credentials
        key: url
  - name: MINIO_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: dwp-minio-credentials
        key: endpoint
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: dwp-jwt-credentials
        key: secret
  - name: OPENSEARCH_ENDPOINT
    value: "http://opensearch:9200"
  - name: CORS_ORIGINS
    value: "https://portal.iribtabriz.ir"
