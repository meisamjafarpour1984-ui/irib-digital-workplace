# ============================================================
# IRIB DWP Backend — Helm Values
# ============================================================

replicaCount: 2

uploads:
  persistence:
    enabled: false
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClassName: ""

image:
  repository: ghcr.io/irib-digital-workplace/irib-digital-workplace-backend
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: ghcr-registry-secret

serviceAccount:
  create: true
  name: dwp-backend-sa
  annotations: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3001"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 3001

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";
  hosts:
    - host: api.iribtabriz.ir
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: dwp-backend-tls
      hosts:
        - api.iribtabriz.ir

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - dwp-backend
          topologyKey: kubernetes.io/hostname

probes:
  liveness:
    httpGet:
      path: /health/live
      port: 3001
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    httpGet:
      path: /health/ready
      port: 3001
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    httpGet:
      path: /health/ready
      port: 3001
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3001"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: dwp-database-credentials
        key: url
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: dwp-redis-credentials
        key: url
  - name: KEYCLOAK_URL
    valueFrom:
      secretKeyRef:
        name: dwp-keycloak-credentials
        key: url
  - name: MINIO_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: dwp-minio-credentials
        key: endpoint
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: dwp-jwt-credentials
        key: secret
  - name: OPENSEARCH_ENDPOINT
    value: "http://opensearch:9200"

envFrom: []

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3001
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 9092
          protocol: TCP
        - port: 9000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
      ports:
        - port: 8080
          protocol: TCP
        - port: 8200
          protocol: TCP
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
