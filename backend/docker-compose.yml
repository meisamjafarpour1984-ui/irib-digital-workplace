    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U irib_admin -d irib_dwp']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cluster
  redis:
    image: redis:7-alpine
    container_name: irib-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass irib_redis_2024
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'irib_redis_2024', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3 Compatible)
  minio:
    image: minio/minio:latest
    container_name: irib-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: irib_minio_admin
      MINIO_ROOT_PASSWORD: irib_minio_2024
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data

  # OpenSearch
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: irib-opensearch
    restart: unless-stopped
    ports:
      - '9200:9200'
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: irib-keycloak
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/irib_dwp
      KC_DB_USERNAME: irib_admin
      KC_DB_PASSWORD: irib_secret_2024
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy

  # PgBouncer Connection Pool
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: irib-pgbouncer
    restart: unless-stopped
    ports:
      - '6432:6432'
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 6432 -U irib_admin']
      interval: 10s
      timeout: 5s
      retries: 5

  # Application
  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: irib-app
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
